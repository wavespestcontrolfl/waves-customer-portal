<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waves" />
    <link rel="apple-touch-icon" href="/waves-logo-192.png" />
    <meta name="description" content="Your Waves service reports, billing, and account — view past visits, track action items, and schedule the next service." />
    <meta property="og:site_name" content="Waves Pest Control" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Waves" />
    <meta property="og:description" content="Your Waves service reports, billing, and account — view past visits, track action items, and schedule the next service." />
    <!-- Default branded preview card. In production, server/index.js's
         renderHTML always rewrites this to an absolute URL on the request's
         own portal origin (server/routes/og-preview.js renders it on
         demand — no checked-in image file); this static fallback (dev /
         a raw index.html serve) points at the production origin so the tag
         is never a bare relative URL, which link-preview crawlers ignore. -->
    <meta property="og:image" content="https://portal.wavespestcontrol.com/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Waves Pest Control" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Waves" />
    <meta name="twitter:description" content="Your Waves service reports, billing, and account — view past visits, track action items, and schedule the next service." />
    <meta name="twitter:image" content="https://portal.wavespestcontrol.com/og/default.jpg" />
    <title>Waves Customer Portal</title>
    <!-- Safari home-screen bookmark: this document is the customer PWA by
         default. In production renderHTML (server/index.js) swaps the
         manifest/title/apple-title/theme-color and adds html.admin-app for
         /admin before the response is sent — do NOT add a second inline
         first-paint script here. In Vite dev the admin identity arrives via
         AdminSafariShell's effect instead (dev is not an install surface). -->
    <link rel="icon" type="image/png" href="/waves-logo-192.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; color: #0F172A; }
      /* Customer/tech brand headings. Scoped away from the admin surface so
         portaled admin sheets/dialogs (rendered outside .admin-shell-v2) don't
         inherit Anton/Montserrat — admin stays Roboto (see index.css). The
         scope sits in :where() so specificity stays (0,0,1): page-level
         heading overrides (e.g. the service report's .sr-section h2 serif in
         pdf/static mode) must still win. */
      :where(html:not(.admin-app)) h1 { font-family: 'Anton', 'Luckiest Guy', cursive; letter-spacing: 0.02em; }
      :where(html:not(.admin-app)) h2, :where(html:not(.admin-app)) h3, :where(html:not(.admin-app)) h4 { font-family: 'Montserrat', 'Inter', sans-serif; }
      h5, h6 { font-family: 'Inter', system-ui, sans-serif; }
      input::placeholder, textarea::placeholder { color: #64748B; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
