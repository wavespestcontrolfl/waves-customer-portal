# First CI test run for the portal (2026-07-12 false-confidence test audit).
# Before this workflow, tests only ran locally and via the Codex pre-push
# hook — and the DB-gated suites never ran anywhere, because nothing set
# DATABASE_URL.
#
# Two-step design (load-bearing — do not flatten into one step):
#   1. The full jest suite runs WITHOUT DATABASE_URL (the `server-unit` job,
#      three parallel shards). Several suites change
#      semantics when it is set: the pricing golden masters
#      (pricing-engine.regression, pricing-engine-v1-adapter.regression) sync
#      live pricing_config and diff against a baseline captured from PROD's
#      admin-edited rows — a fresh migration-seeded DB legitimately differs,
#      so setting DATABASE_URL globally turns them red by design, not by bug.
#   2. The self-skipping DB-gated suites run WITH DATABASE_URL (the
#      `server-db` job) against the migrated database, serially
#      (--runInBand: they share tables and clash under parallel workers),
#      as two halves, each on its own Postgres server.
#      products-catalog-label-fields is
#      excluded — like the golden masters it pins prod-parity data
#      (admin-corrected EPA reg numbers), which a fresh seed cannot satisfy.
#
# Running every migration from an EMPTY database is itself a gate: a
# migration that cannot build the schema from scratch fails here before it
# can block a Railway deploy (verified locally: "Batch 1 run: 917 migrations").
name: tests

# A PR run starts when the PR opens and, after that, only when someone asks:
# a push alone starts nothing. Measured 2026-10-03 on 213 PR runs: 56% were on
# heads a Codex round then replaced, and jobs waited 8 to 20 minutes for a
# runner behind them. The request is a label change (any label, added or
# removed: `labeled` / `unlabeled`), by convention a toggle of `run-ci`. The
# run tests the PR's head merged into the current base, exactly as before.
# `reopened` stays so close-and-reopen still forces a run.
# The merge bar is unchanged: `tests` must be green on the head being merged,
# and a head nobody asked a run for has no `tests` checks at all.
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Only PR runs cancel their superseded predecessor. On main every push shares
# the one ref, and merges land faster than a full run finishes, so
# cancelling there left main with no completed run at all (2026-09-24: 14
# consecutive main pushes, every run cancelled). Main runs queue instead.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repo, so the token stays read-only.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # pgvector/pgvector = official postgres:16 + the vector extension,
        # required by the knowledge_embeddings migration (Railway prod
        # Postgres already ships pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Two more servers so the two longest lanes can run beside the rest (see
      # "Lanes" below). Separate servers, not extra databases on one
      # server: 167 suites refuse any database not named waves_test.
      postgres-b:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-c:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - parallel:
          - name: Migrate from an empty database
            env:
              DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
            run: npx knex migrate:latest --knexfile server/knexfile.js
          - name: Migrate the second server
            env:
              DATABASE_URL: postgresql://waves:waves@localhost:5433/waves_test
            run: npx knex migrate:latest --knexfile server/knexfile.js
          - name: Migrate the third server
            env:
              DATABASE_URL: postgresql://waves:waves@localhost:5434/waves_test
            run: npx knex migrate:latest --knexfile server/knexfile.js
      # Lanes (2026-10-08 trial). Measured on five green runs: this job
      # set the length of every run at 16-18 min, and two steps were 8 of
      # those minutes. They now run as background steps, each on its own
      # server, while every other step runs below on the first server exactly
      # as before. Each lane is still serial against its own database. They
      # sit here, not in their old places, so they start at once. The
      # `wait-all` step at the end of the job fails if either one failed.
      # 2026-11-01: the DB-gated suites moved to the `server-db` job (their
      # lane took 14.6 of this job's 16.3 min, median of 160 runs), and the
      # closeout lane, which the 2026-10-31 sweep grew to 16.4 min, runs as
      # two lanes: closeout, gate-code and lawn suites on the third server,
      # and the sweep's suites on the second.
      # The gate-code suites in the second command gate on
      # `process.env.DATABASE_URL ? describe : describe.skip`, not the
      # `const SKIP` line the DB-gated step greps for, so until 2026-10-30 they
      # ran nowhere in CI. Do not add the `const SKIP` line to them, or they
      # run twice.
      # The third command runs 64 more suites with that same gate (46 of them
      # lawn suites), which also ran nowhere in CI until 2026-10-31.
