                  'tests/customer-geocode-review-visit-lock-order-postgres.test.js',
                  'tests/geocoder-service-locations-postgres.test.js'],
                  { cwd: 'server', env: { ...process.env, SERVICE_GEOCODE_TEST_DATABASE_URL: `${base}${name}` } });
                // Suites that accept only a private waves_qa_ database (sweep #7246 B1).
                run(['../node_modules/jest/bin/jest.js', '--ci', '--runInBand', '--no-coverage',
                  'tests/aeo-measurement-db.test.js', 'tests/completion-read-recovery-postgres.test.js'],
                  { cwd: 'server', env: { ...process.env, AEO_TEST_DATABASE_URL: `${base}${name}`, COMPLETION_READ_TEST_DATABASE_URL: `${base}${name}` } });
                // Managed-QA suites: the local-dev interlock, with this database as the worktree's own.
                run(['../node_modules/jest/bin/jest.js', '--ci', '--runInBand', '--no-coverage',
                  'tests/callback-bridge-postgres.test.js', 'tests/staff-onboarding-postgres.test.js'],
                  { cwd: 'server', env: { ...process.env, DATABASE_URL: `${base}${name}`, WAVES_LOCAL_DEV: '1', WAVES_WORKTREE_ID: name.slice('waves_qa_'.length), CALLBACK_BRIDGE_POSTGRES: '1', WAVES_STAFF_DOCUMENT_TEST_DB: '1' } });
              } finally { await client.query(`DROP DATABASE "${name}" WITH (FORCE)`); }
              // The SMS unread suites build their own tables, so they need an EMPTY
              // waves_qa_ database, reached through 127.0.0.1.
              const empty = `waves_qa_${randomBytes(16).toString('hex')}`;
              await client.query(`CREATE DATABASE "${empty}"`);
              try {
                run(['../node_modules/jest/bin/jest.js', '--ci', '--runInBand', '--no-coverage',
                  'tests/inbound-sms-unread-postgres.test.js', 'tests/sms-pending-conversations-postgres.test.js',
                  'tests/sms-spam-block-postgres.test.js'],
                  { cwd: 'server', env: { ...process.env, UNREAD_TEST_DATABASE_URL: `postgresql://waves:waves@127.0.0.1:5432/${empty}` } });
              } finally { await client.query(`DROP DATABASE "${empty}" WITH (FORCE)`); }
            } finally { await client.end(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
