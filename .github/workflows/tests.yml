            tests/sms-reply-outcomes-postgres.test.js \
            tests/supplies-consumption.test.js \
            tests/termite-renewal-bill-to-fence-postgres.test.js
      # The sweep's commands (sweep #7246 B1, 2026-10-31) run suites whose
      # own variable no step set. Every suite that reads REPAIR_TEST_DATABASE_URL
      # builds its own throwaway schema, so its grep lane picks up a new one by
      # itself. The APP_TEST suites copy the migrated tables into a private
      # schema. The next command sets each single-suite variable, plus
      # DATABASE_URL, which two of those suites require to match. The
      # audit-clone suites refuse any database not named waves_audit_*, and
      # the IB workflow baseline wants a waves_ib_workflow_* database of its
      # own: the first command copies the freshly migrated database to both
      # before any suite writes to it. Nothing else connects to this server,
      # so the copy cannot meet a busy template.
      # tests/ci-db-suites-reached.test.js fails when a self-skipping Postgres
      # suite reaches no step that sets its variable; the suites that cannot
      # run here yet are listed, with reasons, in
      # tests/fixtures/ci-db-suites-not-run.json.
      - name: Postgres suites with their own database variables (serial, on the second server)
        id: own-variables
        background: true
        working-directory: server
        env:
