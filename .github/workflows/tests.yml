# First CI test run for the portal (2026-07-12 false-confidence test audit).
# Before this workflow, tests only ran locally and via the Codex pre-push
# hook — and the DB-gated suites never ran anywhere, because nothing set
# DATABASE_URL.
#
# Two-step design (load-bearing — do not flatten into one step):
#   1. The full jest suite runs WITHOUT DATABASE_URL. Several suites change
#      semantics when it is set: the pricing golden masters
#      (pricing-engine.regression, pricing-engine-v1-adapter.regression) sync
#      live pricing_config and diff against a baseline captured from PROD's
#      admin-edited rows — a fresh migration-seeded DB legitimately differs,
#      so setting DATABASE_URL globally turns them red by design, not by bug.
#   2. The self-skipping DB-gated suites then run WITH DATABASE_URL against
#      the migrated database, serially (--runInBand: they share tables and
#      clash under parallel workers). products-catalog-label-fields is
#      excluded — like the golden masters it pins prod-parity data
#      (admin-corrected EPA reg numbers), which a fresh seed cannot satisfy.
#
# Running every migration from an EMPTY database is itself a gate: a
# migration that cannot build the schema from scratch fails here before it
# can block a Railway deploy (verified locally: "Batch 1 run: 917 migrations").
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # pgvector/pgvector = official postgres:16 + the vector extension,
        # required by the knowledge_embeddings migration (Railway prod
        # Postgres already ships pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Migrate from an empty database
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx knex migrate:latest --knexfile server/knexfile.js
      - name: SMS operational transaction tests
        working-directory: server
        env:
          SMS_OPERATIONS_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/sms-operations-postgres.test.js tests/sms-commitments-postgres.test.js tests/sms-inbound-consumers-postgres.test.js
      - name: SMS copy migration transaction tests
        working-directory: server
        env:
          SMS_TEMPLATE_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/shorten-long-sms-templates-postgres.test.js
      - name: Receipt SMS evidence and migration tests
        working-directory: server
        env:
          RECEIPT_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/receipt-sms-delivery-postgres.test.js
      - name: Request App receipt transaction tests
        working-directory: server
        env:
          APP_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/request-app-receipts-postgres.test.js
      - name: Grouped closeout transaction tests
        working-directory: server
        env:
          VISIT_PACKET_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/visit-completion-packets-postgres.test.js tests/invoice-issued-closeout-completion-postgres.test.js
      - name: Invoice-issued closeout resolver transaction tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/invoice-issued-closeout-postgres.test.js
      - name: Historical invoice repair transaction tests
        working-directory: server
        env:
          REPAIR_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/link-unlinked-visit-invoices-postgres.test.js tests/execute-visit-invoice-plan-postgres.test.js
      - name: Visit summary identity transaction tests
        working-directory: server
        env:
          VISIT_PACKET_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
          DATA_HYGIENE_VAULT_KEY: ci-only-visit-summary-test-key
        run: npx jest --ci --silent --runInBand tests/visit-summary-identity-postgres.test.js
      - name: Visit summary authorization and recovery transaction tests
        working-directory: server
        env:
          VISIT_PACKET_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
          DATA_HYGIENE_VAULT_KEY: ci-only-visit-summary-test-key
        run: npx jest --ci --silent --runInBand tests/visit-completion-summary-postgres.test.js
      - name: Server tests (no DB — golden masters keep in-memory semantics)
        working-directory: server
        run: npx jest --ci --silent --maxWorkers=2
      - name: Customer backend coverage floor
        # A focused, measured threshold for customer-app auth, pricing,
        # autopay, notification, and upload-validation logic. The broad suite
        # above still runs every server test; this step adds the coverage gate.
        working-directory: server
        run: npm run test:customer-coverage
      - name: Customer App preference and delivery transaction tests
        working-directory: server
        env:
          APP_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/customer-app-notifications-postgres.test.js
      - name: DB-gated suites (serial, against the migrated database)
        working-directory: server
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        # --forceExit removed 2026-07-16: the open handle was the shared app
        # pool (models/db) pulled at module scope by lawn-intelligence in
        # lawn-assessment-drift-sweep.test.js — that suite now destroys it in
        # afterAll, and the full serial run exits cleanly on its own.
        run: |
          grep -l 'const SKIP = !process.env.DATABASE_URL' tests/*.test.js \
            | grep -v products-catalog-label-fields \
            | tee /dev/stderr \
            | xargs npx jest --ci --silent --runInBand
      - name: Completion pricing and invoice replay transaction tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
          COMPLETION_PRICING_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/completion-pricing.postgres.test.js
      - name: Combined reservation and conversion transaction tests
        working-directory: server
        env:
          COMBINED_VISIT_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/combined-visit-capacity-postgres.test.js tests/combined-visit-conversion-postgres.test.js
      - name: Catalog allowance transaction tests
        working-directory: server
        env:
          SCHEDULING_CAPACITY_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/scheduling-catalog-postgres.test.js tests/scheduling-capacity-holds-postgres.test.js tests/scheduling-capacity-accept-postgres.test.js tests/scheduling-capacity-allocation-postgres.test.js
      - name: Shared reservation arrival and hold-grace transaction tests
        working-directory: server
        env:
          RESERVATION_ARRIVAL_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
          RESERVATION_HOLD_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/reservation-arrival-postgres.test.js tests/reservation-hold-grace-postgres.test.js
      - name: Staff arrival-window transaction tests
        working-directory: server
        env:
          ARRIVAL_ROUTE_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/arrival-window-placement-db.test.js tests/admin-arrival-window-save-db.test.js
      - name: Protocol publication transaction tests
        working-directory: server
        env:
          PROTOCOL_PUBLISH_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/protocol-publish-postgres.test.js
      - name: Blog queue ownership transaction tests
        working-directory: server
        env:
          BLOG_QUEUE_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/blog-queue-ownership-postgres.test.js
      - name: Intelligence Bar operational transaction tests
        working-directory: server
        env:
          IB_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/intelligence-bar-operational-postgres.test.js tests/intelligence-bar-target-validation-db.test.js tests/intelligence-bar-target-context-db.test.js
      - name: Intelligence Bar task recovery transaction tests
        working-directory: server
        env:
          IB_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --silent --runInBand tests/intelligence-bar-task-recovery-db.test.js
      - name: Tool contract tests (202 IB/agent tools vs the migrated schema)
        # Blocks on critical only (schema drift, missing tables/columns);
        # execute-smoke warnings (e.g. uuid-typed params fed 'test') are
        # reported but never fail the job — same policy as the local runner.
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        working-directory: .
        run: npm run test:contracts
      - name: Intelligence Bar real-database outcome regressions (scripted model)
        env:
          IB_TEST_DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        run: npx jest --ci --runInBand server/tests/intelligence-bar-platform-db.test.js server/tests/invoice-property-history-db.test.js server/tests/customer-properties-db.test.js server/tests/intelligence-bar-properties-db.test.js server/tests/intelligence-bar-inventory-db.test.js server/tests/intelligence-bar-customer-estimates-db.test.js

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Worktree and managed startup checks
        run: npm run test:dev-workflow
      - name: Client tests (vitest)
        working-directory: client
        run: npm run test:coverage
      - name: Customer app production build
        # Vite production compilation catches chunking, CSS/import, and
        # service-worker asset failures that the jsdom test runtime cannot.
        run: npm run build

  browser-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:qa-workflow
      - name: Portal, payment, report and completion previews
        run: npm run qa:previews
      - name: Email workspace synthetic scenarios
        if: ${{ !cancelled() }}
        run: node scripts/qa/admin-email-workspace.cjs
      - name: Estimate interaction and PDF previews
        if: ${{ !cancelled() }}
        env:
          ESTIMATE_PREVIEW_SCENARIOS: pest,lawn,wdo,preslab,proposal,expired
          ESTIMATE_PREVIEW_ARTIFACT_DIR: .tmp/qa/estimates
        run: npm run audit:estimate-previews
      - name: Browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: |
            .tmp/qa/
            .tmp/email-workspace/
          # Both paths live under a dot-directory, which upload-artifact@v4
          # skips unless hidden files are opted in.
          include-hidden-files: true
          retention-days: 7

  application-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run worktree:setup
      - name: Select the disposable CI database cluster
        run: |
          node -e "require('node:fs').writeFileSync('.tmp/dev/database.env', 'WAVES_DATABASE_ENVIRONMENT=test\nDATABASE_URL=postgresql://waves:waves@localhost:5432/waves_test\n', {mode: 0o600})"
      - run: npm run qa:database
      - name: Migrate the private QA database
        # A legacy repair migration removes an earlier placeholder's ledger
        # entry. The second pass settles that entry before doctor checks it.
        run: |
          npm run dev:migrate
          npm run dev:migrate
      - name: Real auth, booking, settlement and report journeys
        run: npm run qa:e2e
      - name: Remove synthetic accounts and journey records
        if: always()
        run: npm run qa:cleanup
      - name: Verify retained journey results survived cleanup
        run: |
          node -e "const r = require('./.tmp/qa/e2e/report.json'); require('node:assert/strict').equal(r.steps.filter(s => s.passed).length, 13)"
      - name: Application QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-qa-${{ github.sha }}
          path: |
            .tmp/qa/e2e/report.json
            .tmp/qa/e2e/cleanup.json
            .tmp/qa/e2e/*.png
            .tmp/qa/e2e/trace.zip
          retention-days: 7

  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The bootstrap scripts suppress IDE launch only in CI mode.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate and sync the pinned Android app
        run: bash scripts/mobile/bootstrap-android.sh
      - name: Compile Android debug app
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

  native-ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # macos-15 currently ships CocoaPods 1.16.2 and Xcode 16.4. Pin the
      # selected Xcode so an image-default change cannot silently move builds.
      CI: "true"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Verify pinned iOS toolchain
        run: |
          xcodebuild -version
          pod --version
          xcodeproj --version
      - name: Generate and sync the pinned iOS app
        run: bash scripts/mobile/bootstrap-ios.sh
      - name: Verify iOS push signing setup and release checks
        run: python3 scripts/mobile/test_ios_push.py
      - name: Compile iOS simulator app without signing
        working-directory: client/ios/App
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  # The prebuild gates + errors-only lint, moved off deploy-time/local-hook
  # enforcement so a violation fails the PR instead of killing every Railway
  # build (brand/domain/blog gates) or slipping through a bypassed pre-commit
  # hook (lint — `git commit -n` is a documented escape hatch).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changed-files lint diffs against the PR base's
          # merge-base, which a shallow clone doesn't have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Blog schema vendor check
        run: npm run verify:blog-schema
      - name: Portal brand gate
        run: npm run check:portal-brand
      - name: Domain rules gate
        run: npm run check:domain-rules
      - name: Intelligence Bar capability coverage drift
        run: npm run check:ib-coverage
      - name: Local session supervisor lifecycle tests
        run: python3 -m unittest discover -s scripts/agents/tests -v
      - name: Lint changed files (errors-only, same scope as the pre-commit hook)
        # Changed-files-only is deliberate — the repo has no lint history and
        # eslint.config.js encodes that decision. Full-repo lint would flag
        # untouched legacy code. PR events only: a push to main already ran
        # this on its PR.
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- \
            '*.js' '*.jsx' '*.cjs' '*.mjs')
          if [ -n "$files" ]; then
            echo "$files"
            echo "$files" | xargs npx eslint --no-warn-ignored
          else
            echo "No JS/JSX changes to lint."
          fi
