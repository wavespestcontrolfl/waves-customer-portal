# First CI test run for the portal (2026-07-12 false-confidence test audit).
# Before this workflow, tests only ran locally and via the Codex pre-push
# hook — and the DB-gated suites never ran anywhere, because nothing set
# DATABASE_URL.
#
# Two-step design (load-bearing — do not flatten into one step):
#   1. The full jest suite runs WITHOUT DATABASE_URL (the `server-unit` job,
#      three parallel shards). Several suites change
#      semantics when it is set: the pricing golden masters
#      (pricing-engine.regression, pricing-engine-v1-adapter.regression) sync
#      live pricing_config and diff against a baseline captured from PROD's
#      admin-edited rows — a fresh migration-seeded DB legitimately differs,
#      so setting DATABASE_URL globally turns them red by design, not by bug.
#   2. The self-skipping DB-gated suites run WITH DATABASE_URL (the `server`
#      job) against the migrated database, serially (--runInBand: they share tables and
#      clash under parallel workers; the job runs three serial lanes, each on
#      its own Postgres server). products-catalog-label-fields is
#      excluded — like the golden masters it pins prod-parity data
#      (admin-corrected EPA reg numbers), which a fresh seed cannot satisfy.
#
# Running every migration from an EMPTY database is itself a gate: a
# migration that cannot build the schema from scratch fails here before it
# can block a Railway deploy (verified locally: "Batch 1 run: 917 migrations").
name: tests

# A PR run starts when the PR opens and, after that, only when someone asks:
# a push alone starts nothing. Measured 2026-10-03 on 213 PR runs: 56% were on
# heads a Codex round then replaced, and jobs waited 8 to 20 minutes for a
# runner behind them. The request is a label change (any label, added or
# removed: `labeled` / `unlabeled`), by convention a toggle of `run-ci`. The
# run tests the PR's head merged into the current base, exactly as before.
# `reopened` stays so close-and-reopen still forces a run.
# The merge bar is unchanged: `tests` must be green on the head being merged,
# and a head nobody asked a run for has no `tests` checks at all.
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Only PR runs cancel their superseded predecessor. On main every push shares
# the one ref, and merges land faster than a full run finishes, so
# cancelling there left main with no completed run at all (2026-09-24: 14
# consecutive main pushes, every run cancelled). Main runs queue instead.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THROWAWAY, never merge: proves a failed background step turns the job red.
  with-wait-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Background step that fails
        id: bg-fail
        background: true
        run: sleep 20; echo "background step failing on purpose"; exit 1
      - name: Foreground step that passes
        run: echo ok
      - name: Wait for the background lanes
        wait-all:
  without-wait:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Background step that fails
        id: bg-fail
        background: true
        run: sleep 20; echo "background step failing on purpose"; exit 1
      - name: Foreground step that passes
        run: echo ok
