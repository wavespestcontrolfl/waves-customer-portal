  # Step 2 of the two-step design, on a runner of its own (2026-11-01): the
  # DB-gated suites set the length of every run while they shared the
  # `server` job's 4 vCPU (14.6 of its 16.3 min, median of 160 runs). They
  # run as two halves, each serial against its own server; `jest --shard`
  # gives every file to exactly one half.
  server-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-b:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - parallel:
          - name: Migrate the first server
            env:
              DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
            run: npx knex migrate:latest --knexfile server/knexfile.js
          - name: Migrate the second server
            env:
              DATABASE_URL: postgresql://waves:waves@localhost:5433/waves_test
            run: npx knex migrate:latest --knexfile server/knexfile.js
      - name: DB-gated suites, first half (serial, against the migrated database)
        id: db-gated
        background: true
        working-directory: server
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5432/waves_test
        # --forceExit removed 2026-07-16: the open handle was the shared app
        # pool (models/db) pulled at module scope by lawn-intelligence in
        # lawn-assessment-drift-sweep.test.js — that suite now destroys it in
        # afterAll, and the full serial run exits cleanly on its own.
        run: |
          grep -l 'const SKIP = !process.env.DATABASE_URL' tests/*.test.js \
            | grep -v products-catalog-label-fields \
            | tee /dev/stderr \
            | xargs npx jest --ci --silent --runInBand --shard=1/2
      - name: DB-gated suites, second half (serial, against the migrated database)
        id: db-gated-2
        background: true
        working-directory: server
        env:
          DATABASE_URL: postgresql://waves:waves@localhost:5433/waves_test
        run: |
          grep -l 'const SKIP = !process.env.DATABASE_URL' tests/*.test.js \
            | grep -v products-catalog-label-fields \
            | tee /dev/stderr \
            | xargs npx jest --ci --silent --runInBand --shard=2/2
      - name: Wait for both halves (fails if either failed)
        wait-all:

  # Step 1 of the two-step design: the full jest suite WITHOUT DATABASE_URL
  # (no Postgres service here, on purpose). It was the long pole of the whole
  # run (~16 of the server job's ~22 minutes), so it runs as three parallel
  # shards. `jest --shard` splits the test files deterministically: every file
  # runs in exactly one shard. fail-fast is off so one red shard does not
  # cancel the others and hide their failures.
  server-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Server tests (no DB — golden masters keep in-memory semantics)
        working-directory: server
        # Recycle cumulative worker heaps between suites before V8 exhausts its limit.
        # Three workers on the 4-vCPU runner: shards took 3-7 min against 5-8 with two.
        # The default 5 s test timeout is raised to 15 s because a third worker slows
        # cold module loads; a test that sets its own timeout keeps it.
        run: npx jest --ci --silent --maxWorkers=3 --shard=${{ matrix.shard }}/3 --config='{"workerIdleMemoryLimit":"2GB","testTimeout":15000}'

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Worktree and managed startup checks
        run: npm run test:dev-workflow
      - name: Customer app coverage floor (the tests related to the gated files)
        # The whole vitest suite runs in the `client-unit` shards. A shard sees
        # a third of the tests, so it cannot measure the coverage floor in
        # client/vite.config.js; this step runs every test that imports one of
        # the gated files and checks the floor on them.
        working-directory: client
        run: npm run test:coverage-floor
      - name: Customer app production build
        # Vite production compilation catches chunking, CSS/import, and
        # service-worker asset failures that the jsdom test runtime cannot.
        run: npm run build

  # The whole client suite (708 files, ~12 min on one runner, the longest job
  # of the run once the server job ran in lanes) as three parallel shards.
  # `vitest --shard` splits the test files deterministically: every file runs
  # in exactly one shard. No coverage here; the floor is the `client` job's.
  client-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Client tests (vitest)
        working-directory: client
        run: npx vitest run --silent --shard=${{ matrix.shard }}/3

  browser-previews:
    # ubuntu-24.04, not ubuntu-latest: on the Ubuntu 26.04 image (2026-10-31)
    # `playwright install` fails with "Playwright does not support chromium
    # on ubuntu26.04-x64". Move back once the pinned Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:qa-workflow
      - name: Portal, payment, report and completion previews
        run: npm run qa:previews
      - name: Email workspace synthetic scenarios
        if: ${{ !cancelled() }}
        run: node scripts/qa/admin-email-workspace.cjs
      - name: Estimate interaction and PDF previews
        if: ${{ !cancelled() }}
        env:
          ESTIMATE_PREVIEW_SCENARIOS: pest,lawn,wdo,preslab,proposal,expired
          ESTIMATE_PREVIEW_ARTIFACT_DIR: .tmp/qa/estimates
        run: npm run audit:estimate-previews
      - name: Browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-qa-${{ github.sha }}
          path: |
            .tmp/qa/
            .tmp/email-workspace/
          # Both paths live under a dot-directory, which upload-artifact@v4
          # skips unless hidden files are opted in.
          include-hidden-files: true
          retention-days: 7

  application-qa:
    # ubuntu-24.04, not ubuntu-latest: on the Ubuntu 26.04 image (2026-10-31)
    # `playwright install` fails with "Playwright does not support chromium
    # on ubuntu26.04-x64". Move back once the pinned Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waves
          POSTGRES_PASSWORD: waves
          POSTGRES_DB: waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run worktree:setup
      - name: Select the disposable CI database cluster
        run: |
          node -e "require('node:fs').writeFileSync('.tmp/dev/database.env', 'WAVES_DATABASE_ENVIRONMENT=test\nDATABASE_URL=postgresql://waves:waves@localhost:5432/waves_test\n', {mode: 0o600})"
      - run: npm run qa:database
      - name: Migrate the private QA database
        # A legacy repair migration removes an earlier placeholder's ledger
        # entry. The second pass settles that entry before doctor checks it.
        run: |
          npm run dev:migrate
          npm run dev:migrate
      - name: Real auth, booking, settlement and report journeys
        run: npm run qa:e2e
      - name: Remove synthetic accounts and journey records
        if: always()
        run: npm run qa:cleanup
      - name: Verify retained journey results survived cleanup
        run: |
          node -e "const r = require('./.tmp/qa/e2e/report.json'); require('node:assert/strict').equal(r.steps.filter(s => s.passed).length, 13)"
      - name: Application QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-qa-${{ github.sha }}
          path: |
            .tmp/qa/e2e/report.json
            .tmp/qa/e2e/cleanup.json
            .tmp/qa/e2e/*.png
            .tmp/qa/e2e/trace.zip
          retention-days: 7

  native-android:
    # `gates` reports whether the PR touches anything the mobile builds read
    # (see its "mobile scope" step). Fails open: no answer still builds.
    needs: gates
    if: ${{ !cancelled() && needs.gates.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The bootstrap scripts suppress IDE launch only in CI mode.
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Generate and sync the pinned Android app
        run: bash scripts/mobile/bootstrap-android.sh
      - name: Compile Android debug app
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

  native-ios:
    # Same scope rule as native-android. macOS runners are capped at 5 at a
    # time on this plan, so a build nobody needs is the costliest one to queue.
    needs: gates
    if: ${{ !cancelled() && needs.gates.outputs.mobile != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # macos-15 currently ships CocoaPods 1.16.2 and Xcode 16.4. Pin the
      # selected Xcode so an image-default change cannot silently move builds.
      CI: "true"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Verify pinned iOS toolchain
        run: |
          xcodebuild -version
          pod --version
          xcodeproj --version
      - name: Generate and sync the pinned iOS app
        run: bash scripts/mobile/bootstrap-ios.sh
      - name: Verify iOS push signing setup and release checks
        run: python3 scripts/mobile/test_ios_push.py
      - name: Compile iOS simulator app without signing
        working-directory: client/ios/App
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  # The prebuild gates + errors-only lint, moved off deploy-time/local-hook
  # enforcement so a violation fails the PR instead of killing every Railway
  # build (brand/domain/blog gates) or slipping through a bypassed pre-commit
  # hook (lint — `git commit -n` is a documented escape hatch).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mobile: ${{ steps.mobile-scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the changed-files lint diffs against the PR base's
          # merge-base, which a shallow clone doesn't have.
          fetch-depth: 0
      - name: Mobile scope (do the iOS and Android builds need to run?)
        id: mobile-scope
        # The mobile builds compile the web app (client/, shared/, the root
        # lockfile) and scripts/mobile. They are skipped ONLY when every file
        # the PR changes sits in a directory they never read. Anything else
        # builds both apps: another directory, a root file, an empty or
        # unreadable diff, a push to main. First step after checkout, so the
        # answer exists even when a later gate fails.
        #
        # server/ is such a directory except for the files the bundle pulls in
        # through shared/ or client source (today one JSON,
        # server/services/estimate-one-time-copy.json). They are read from the
        # code, never listed here: a change to one builds, and if the bundle
        # ever reaches server CODE (whose own imports this step cannot
        # follow), every server change builds.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mobile=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames: a rename is listed as its old path AND its new one, so
            # moving a build input into a skip-safe directory still builds.
            if files=$(git diff --name-only --no-renames "origin/${BASE_REF}...HEAD") && [ -n "$files" ]; then
              inputs=$(git grep -hoE '\.\./server/[A-Za-z0-9_./-]+' -- shared client/vite.config.js client/src ':(exclude,glob)client/src/**/*.test.*' | sed -E 's#^(\.\./)+##' | sort -u || true)
              safe='^(server|docs|\.claude|ops|video|wiki)/'
              if printf '%s\n' "$inputs" | grep -qvE '\.json$|^$'; then safe='^(docs|\.claude|ops|video|wiki)/'; fi
              outside=$(printf '%s\n' "$files" | grep -vE "$safe" || true)
              hit=""
              if [ -n "$inputs" ]; then hit=$(printf '%s\n' "$files" | grep -xF -f <(printf '%s\n' "$inputs") || true); fi
              if [ -z "$outside" ] && [ -z "$hit" ]; then mobile=false; fi
            fi
          fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "mobile builds needed: $mobile"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Blog schema vendor check
        run: npm run verify:blog-schema
      - name: Portal brand gate
        run: npm run check:portal-brand
      - name: Domain rules gate
        run: npm run check:domain-rules
      - name: Intelligence Bar capability coverage drift
        run: npm run check:ib-coverage
      - name: Technician-reachable routes list is current
        run: npm run check:technician-routes
      - name: Local session supervisor lifecycle tests
        run: python3 -m unittest discover -s scripts/agents/tests -v
      - name: Lint changed files (errors-only, same scope as the pre-commit hook)
        # Changed-files-only is deliberate — the repo has no lint history and
        # eslint.config.js encodes that decision. Full-repo lint would flag
        # untouched legacy code. PR events only: a push to main already ran
        # this on its PR.
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- \
            '*.js' '*.jsx' '*.cjs' '*.mjs')
          if [ -n "$files" ]; then
            echo "$files"
            echo "$files" | xargs npx eslint --no-warn-ignored
          else
            echo "No JS/JSX changes to lint."
          fi
