      - name: Customer 360 SMS read and bell transaction tests
        run: |
          node <<'JS'
          const { Client } = require('pg');
          const { randomBytes } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const name = `waves_qa_${randomBytes(16).toString('hex')}`;
          const base = 'postgresql://waves:waves@localhost:5432/';
          const client = new Client({ connectionString: `${base}waves_test` });
          function run(args, options = {}) {
            const result = spawnSync(process.execPath, args, { stdio: 'inherit', ...options });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`QA command exited ${result.status}`);
          }
          (async () => {
            await client.connect();
            try {
              await client.query(`CREATE DATABASE "${name}"`);
              try {
                run(['node_modules/knex/bin/cli.js', 'migrate:latest', '--knexfile', 'server/knexfile.js'],
                  { env: { ...process.env, DATABASE_URL: `${base}${name}` } });
