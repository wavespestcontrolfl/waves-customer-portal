# Claude automated PR review — the Claude counterpart of the @codex bot.
#
# Runs on every non-draft PR from this repo (opened / new push / reopened /
# marked ready). Claude checks out the PR with full history, reads AGENTS.md
# (the P0/P1/P2 rubric) and CLAUDE.md, fans out specialist subagents, then
# adversarially verifies every candidate finding before posting. Findings
# land as inline comments on the changed lines, and the run's tracking
# comment is finished as the summary, headed `## Claude review` with a
# `Verdict:` line, so a clean round is grep-able the same way a Codex round
# is.
#
# Comments only, enforced three ways: the action gets the workflow's own
# GITHUB_TOKEN (scoped by `permissions:` below — contents:read, so no push
# is possible), every file-edit and git tool is in --disallowedTools (deny
# beats the action's acceptEdits default), and the gh allowlist holds only
# read-only subcommands. No shell `git` at all — `git diff --no-index
# --text <path>` prints any file, so a prompt-injected PR could read the
# runner's environment through it; code reading goes through Read / Grep /
# Glob and `gh pr diff`. Re-review a PR by hand with `@claude review`
# (handled by claude.yml).
#
# One-time setup: repo secret ANTHROPIC_API_KEY (Console key). To bill a
# Claude subscription instead, set CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token` and swap the `anthropic_api_key` line for
# `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
# Until the secret exists the job is inert (green, with a notice).
#
# Fork PRs are skipped (secrets are not exposed to forks on a public repo);
# drafts wait for ready_for_review. A new push cancels the in-flight review
# of the same PR.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # Inert until the secret exists: skip (green, with a notice) rather
      # than fail every PR check while the one-time setup is pending.
      - name: Check credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set — Claude review skipped"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The workflow token, not a Claude App token: its scope is exactly
          # the `permissions:` block above.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tracking comment = the review summary; the action's own
          # update_claude_comment tool is the only way it is written.
          track_progress: true
          # Review model: repo variable CLAUDE_REVIEW_MODEL (Settings ->
          # Actions -> Variables) overrides the Opus 5 fallback — set it to
          # claude-fable-5-1 for the strongest (and most expensive) pass; every
          # push re-reviews, so weigh cost per PR round. The literal fallback
          # is the documented Actions exception to the AGENTS.md model-ID rule.
          # --effort max = deepest reasoning per turn; CLAUDE_REVIEW_MAX_USD
          # (default 25) is the per-run spend ceiling — a run that hits it
          # stops early and says so in its summary rather than posting a
          # partial verdict as if complete.
          # --setting-sources user: never load this checkout's .claude/settings.json
          # (its allowlist approves npm commands, which a PR-controlled
          # package.json could weaponize) — the allow/deny lists below are the
          # whole permission set. CLAUDE.md is then not auto-loaded either;
          # the prompt tells the reviewer to read it and AGENTS.md explicitly.
          claude_args: |
            --setting-sources user
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
            --effort max
            --max-turns 200
            --max-budget-usd ${{ vars.CLAUDE_REVIEW_MAX_USD || '25' }}
            --allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git rm:*),Bash(git reset:*),Bash(git stash:*),Bash(git branch:*),Bash(git config:*),Bash(git fetch:*),Bash(git pull:*),Bash(git merge:*),Bash(git rebase:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            You are the automated code reviewer for this pull request, in the
            same role as the @codex bot. Your job is to find REAL defects
            before merge: bugs, security holes, money and data-integrity
            errors, broken contracts, and violations of the repository rubric.
            The PR branch is checked out in the working directory; read it
            with Read / Grep / Glob and the diff with `gh pr diff`.

            ## Rubric

            1. Read `AGENTS.md` at the repo root IN FULL before reading the
               diff. It is the review rubric: every P0 / P1 / P2 rule names
               the failure it prevents and the file it protects. Then read
               `CLAUDE.md`. `docs/public-route-contracts.md` is authoritative
               for any unauthenticated or `/:token` route the diff touches.
            2. Severity: P0 = security, money, data loss, or an external
               contract break (must fix before merge). P1 = a correctness bug
               or footgun that will bite in production. P2 = a real but minor
               defect. Cite the AGENTS.md rule by its bold title when one
               applies. Respect the AGENTS.md "Out of scope" and settled
               owner rulings sections: never flag those.

            ## How to review

            1. Read the PR with `gh pr view` (title, body) and `gh pr diff`.
               The PR body may record an owner ruling, name the existing
               mechanism a new one replaces, or state what was NOT verified
               — take that into account.
            2. Earlier review rounds are in the PR comments and review
               comments provided in your context. If a previous
               `## Claude review` summary exists, this round is INCREMENTAL:
               confirm each earlier finding is fixed or answered, review the
               new commits in depth, and do not re-post a finding that
               already stands as an open comment on the same line.
            3. For every changed file, read the surrounding code and its
               callers, not just the hunks. Trace each change end to end
               (UI -> route -> service -> DB -> response -> UI state) plus
               side effects: webhooks, crons, SMS/email sends, Stripe and
               Twilio calls, caches, analytics. Verify column names, env
               vars, exported names, migration CHECK constraints, and route
               mounts against the actual code. Never assume a name exists.
            4. Fan out with the Agent tool. Run these passes in parallel and
               give each one the PR title, body, and diff. Each pass reads
               the real code around the diff, not just the hunks:
               - bug hunt A: assume the diff contains at least one defect
                 and find it — off-by-one, inverted condition, wrong
                 variable, null/undefined path, async ordering, unhandled
                 rejection, error swallowed, wrong HTTP status, stale
                 closure or effect dependency in React
               - bug hunt B (independent, do not share A's notes): read the
                 PR description first, then check whether the code actually
                 does what it claims for every branch, and whether any
                 stated verification could not have exercised the code path
               - impact analysis: for every changed export, function
                 signature, DB column, enum/status value, env var, route
                 path, or response shape, grep the whole repo (server,
                 client, tests, migrations, ops/, docs/public-route-contracts.md)
                 for every reader and caller, and confirm each one still
                 works — a call site the PR forgot is the most common bug
                 that only shows in production
               - security: auth on every new route, parameterized SQL,
                 token gates, PII and secrets in logs, forgeable client input,
                 mass assignment from req.body, IDOR on ids
               - money and state integrity: Stripe amounts agreeing to the
                 cent, surcharge via computeChargeAmount, idempotency, atomic
                 conditional updates, scheduled_services status values,
                 customer-facing sends that a change could trigger
               - concurrency and data: races between crons / webhooks /
                 handlers on the same rows, missing FOR UPDATE or conditional
                 UPDATE, non-transactional multi-row writes, migrations that
                 are destructive, non-idempotent, or leave existing rows
                 violating a new constraint, unbounded queries and N+1 in
                 list endpoints
               - AGENTS.md rubric compliance, rule by rule against the diff
               - tests: do the new or changed tests actually exercise the
                 change, near-today date literals, virtual mocks, mocked
                 behavior that diverges from the real module, assertions
                 that would still pass if the fix were reverted
               - Eastern-time handling and timezone-naive date math
               Then check CI: `gh pr checks` and the CI tools available to
               you. If the `tests` workflow failed on this head, read the
               failing job log and tie the failure to the diff where it
               belongs (a failure caused by this PR is a finding; a failure
               inherited from main is noted in the summary, not flagged).
            5. Adversarial verification before posting anything: for each
               candidate finding launch a verifier subagent with the file,
               line, the claim, and the strongest counter-argument. It must
               confirm, by reading the code, that the failure scenario is
               reachable in the code this PR introduces or changes. Drop
               anything that is not confirmed, that is pre-existing and
               untouched by the diff, or that is a style, naming, coverage-
               percentage, or speculative-refactor comment. A false positive
               costs more than a missed nit.

            ## Posting

            - One inline comment per confirmed finding via
              `mcp__github_inline_comment__create_inline_comment` with
              `confirmed: true`, anchored on the changed line. Format:
              `**P0 — <title>**` (or P1 / P2), then what is wrong, the
              concrete failure scenario (inputs or state -> wrong result),
              and the fix. Include a committable suggestion block only when
              committing it fixes the issue entirely. One comment per unique
              issue.
            - Finish by writing the summary into your tracking comment
              (`mcp__github_comment__update_claude_comment`). It starts with
              `## Claude review`, then a single line `Verdict: P0 found` /
              `Verdict: no P0, <n> P1` / `Verdict: clean`, then the findings
              as a list of `P<x> path:line — title`, then one short
              paragraph naming what you checked. When nothing was found
              write "No issues found." and the checked list. No praise, no
              padding. If you ran out of budget or turns before finishing,
              say `Verdict: incomplete` and name what was not reviewed.
            - Never edit files, commit, push, approve, or request changes.
              Comments only.
            - Never put customer names, phone numbers, emails, street
              addresses, or invoice numbers in a comment. Refer to records
              by id.
