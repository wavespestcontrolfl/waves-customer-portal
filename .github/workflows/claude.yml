# @claude on demand — answer a question about a PR or issue, or re-run the
# review on the current head (`@claude review`). Companion to
# claude-code-review.yml, which reviews every PR automatically.
#
# Only users with write access to the repo can trigger it (the action's
# default; the repo is public). Comments only, enforced the same three ways
# as claude-code-review.yml: the workflow's own GITHUB_TOKEN scoped by
# `permissions:` (contents:read), every edit / git tool in
# --disallowedTools (no shell git at all — see claude-code-review.yml), and
# two exact `gh pr diff` forms as the only shell commands (no `--jq`-capable
# gh prefix: jq's $ENV reads the environment).
#
# Needs the ANTHROPIC_API_KEY secret — see the header of
# claude-code-review.yml. Inert (green, with a notice) until it exists.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # Inert until the secret exists: skip (green, with a notice) rather
      # than fail every PR check while the one-time setup is pending.
      - name: Check credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set — Claude review skipped"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.present == 'true'
        with:
          fetch-depth: 1
          # No checkout token left in .git/config for the reviewer to read.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # --setting-sources user: never load this checkout's .claude/settings.json
          # (its allowlist approves npm commands, which a PR-controlled
          # package.json could weaponize) — the allow/deny lists below are the
          # whole permission set. CLAUDE.md is then not auto-loaded either;
          # the prompt tells the reviewer to read it and AGENTS.md explicitly.
          claude_args: |
            --setting-sources user
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5' }}
            --effort max
            --max-turns 200
            --max-budget-usd ${{ vars.CLAUDE_REVIEW_MAX_USD || '25' }}
            --allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }}),Bash(gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }} --name-only)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git switch:*),Bash(git rm:*),Bash(git reset:*),Bash(git stash:*),Bash(git branch:*),Bash(git config:*),Bash(git fetch:*),Bash(git pull:*),Bash(git merge:*),Bash(git rebase:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Read(./.git/**),Read(//proc/**),Read(//dev/**),Read(//home/runner/work/_actions/**),Read(~/.gitconfig),Read(~/.git-credentials),Read(~/.config/**)"
            --append-system-prompt "You are reviewing or answering questions about code in the Waves customer portal. Before reviewing any diff read AGENTS.md (the P0/P1/P2 rubric) and CLAUDE.md in full. When asked to review, apply the same standard as the automated claude-review workflow: verify every finding by reading the code, post inline comments with confirmed true, and finish your tracking comment with a heading of ## Claude review and a Verdict line. Comments only: never edit, commit, or push. Never put customer names, phone numbers, emails, addresses, or invoice numbers in a comment."
