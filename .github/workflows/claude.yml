# @claude on demand — answer a question about a PR or issue, or re-run the
# review on the current head (`@claude review`). Companion to
# claude-code-review.yml, which reviews every PR automatically.
#
# Only users with write access to the repo can trigger it (the action's
# default; the repo is public). The token is `contents: read`, so Claude
# can read code and post comments but cannot commit or push from here.
#
# Needs the Claude GitHub App installed and the ANTHROPIC_API_KEY secret —
# see the header of claude-code-review.yml.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Inert until the secret exists: skip (green, with a notice) rather
      # than fail every PR check while the one-time setup is pending.
      - name: Check credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set — Claude review skipped"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*)"
            --append-system-prompt "You are reviewing or answering questions about code in the Waves customer portal. Before reviewing any diff read AGENTS.md (the P0/P1/P2 rubric) and CLAUDE.md in full. When asked to review, apply the same standard as the automated claude-review workflow: verify every finding by reading the code, post inline comments with confirmed: true, and finish with one summary comment headed '## Claude review' and a 'Verdict:' line. Comments only: never edit, commit, or push. Never put customer names, phone numbers, emails, addresses, or invoice numbers in a comment."
